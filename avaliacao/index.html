<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Minhas Life Competencies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one big centered "tablet card" per question. Answer cards are deliberately neutral: same shape, three fixed colours by position, no icons that hint at a "good" answer. Coordinator panel = dense table view. */
:root{
  --bg:#eef4f1; --surface:#ffffff; --ink:#15332a; --muted:#5b7169; --line:#d5e2dc;
  --brand:#0b7a4b; --brand-ink:#ffffff;
  --cog:#0f8a5f; --glo:#7a5fd0; --dig:#2563d6; --aut:#d63a72; --int:#d99a00;
  --o0:#2f7fd8; --o1:#e8822a; --o2:#8a5cd6;
  --lvl1:#f6c9c2; --lvl2:#fbe3a3; --lvl3:#bfe6cf; --lvl-ink:#15332a;
  --h0:#f1f5f3; --h1:#d6ece0; --h2:#a9d8bd; --h3:#6fbf93; --h-ink:#15332a;
  --ok:#1f8a4c; --no:#c2413a; --flag:#b4530a; --flag-bg:#fde7cf;
  --display:"Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a16; --surface:#16261f; --ink:#e6f2ec; --muted:#9db3aa; --line:#2b4238;
  --brand:#3fbf86; --brand-ink:#08231a;
  --cog:#3fbf86; --glo:#a48ff0; --dig:#6b9cff; --aut:#ff7aa6; --int:#f2c14e;
  --o0:#5a9ff0; --o1:#f29a4d; --o2:#a985ef;
  --lvl1:#6b2f2a; --lvl2:#6a5419; --lvl3:#1f5a3c; --lvl-ink:#f1f7f4;
  --h0:#1b2c25; --h1:#1f3d2f; --h2:#25583f; --h3:#2f7a55; --h-ink:#f1f7f4;
  --ok:#5fd18f; --no:#ff8a80; --flag:#ffb070; --flag-bg:#4a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a16; --surface:#16261f; --ink:#e6f2ec; --muted:#9db3aa; --line:#2b4238;
  --brand:#3fbf86; --brand-ink:#08231a;
  --cog:#3fbf86; --glo:#a48ff0; --dig:#6b9cff; --aut:#ff7aa6; --int:#f2c14e;
  --o0:#5a9ff0; --o1:#f29a4d; --o2:#a985ef;
  --lvl1:#6b2f2a; --lvl2:#6a5419; --lvl3:#1f5a3c; --lvl-ink:#f1f7f4;
  --h0:#1b2c25; --h1:#1f3d2f; --h2:#25583f; --h3:#2f7a55; --h-ink:#f1f7f4;
  --ok:#5fd18f; --no:#ff8a80; --flag:#ffb070; --flag-bg:#4a2e12; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:10px}
.wheel{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--cog) 0 72deg,var(--glo) 0 144deg,var(--dig) 0 216deg,var(--aut) 0 288deg,var(--int) 0 360deg);position:relative;flex:none}
.wheel::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 14px;font-weight:600;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.card{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px #0b3a2655}
.lbl{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.grades button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:1.15rem;min-width:58px}
.grades button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.btn{border:0;border-radius:18px;padding:16px 26px;font-family:var(--display);font-weight:800;font-size:1.35rem;background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line);font-size:1rem;padding:10px 16px}
.btn.small{font-size:1rem;padding:10px 18px;border-radius:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem;padding:4px}
.note{font-size:.9rem;color:var(--muted)}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.tests{grid-template-columns:1fr}}
.tests button{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tests button b{font-family:var(--display);font-size:1.25rem}
.tests button span{font-size:.85rem;color:var(--muted)}
.tests button[aria-pressed="true"]{border-color:var(--brand);background:var(--surface);box-shadow:inset 0 0 0 2px var(--brand)}
.identq{margin:0;font-size:1.1rem;font-weight:600;color:var(--muted)}
.ptabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.ptabs button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.ptabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
td.part{color:var(--flag);font-weight:700}
.stagehint{border-radius:14px;padding:12px 14px;background:var(--bg);font-size:.92rem}

/* quiz */
.progress{display:flex;gap:6px;flex-wrap:wrap}
.progress i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.progress i.done{background:var(--brand)}
.progress i.cur{background:var(--ink);transform:scale(1.25)}
.q{border-top:10px solid var(--brand);display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.qrow{display:flex;align-items:center;justify-content:center;gap:14px;max-width:100%}
.qrow .qtext{min-width:0}
.speak-ic{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transition:transform .12s}
.speak-ic:hover{transform:scale(1.08)}
.speak-ic:active{transform:scale(.95)}
.chips:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c);border:2px solid var(--c);border-radius:999px;padding:3px 12px}
.opt .sktag{margin-top:auto;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--c);border-top:2px solid var(--c);padding-top:6px;align-self:stretch;text-align:center}
@media (max-width:620px){.opt{flex-wrap:wrap}.opt .sktag{flex-basis:100%;text-align:left}}
.wheelimg{width:min(340px,80vw);aspect-ratio:1;max-width:100%;height:auto;display:block}
.scene{font-size:clamp(3.5rem,12vw,5.5rem);line-height:1}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4.4vw,2.2rem);max-width:30ch}
.speak{border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:10px 20px;font-weight:600;display:inline-flex;gap:8px;align-items:center;font-size:1rem}
.opts{display:grid;gap:14px;width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{--oc:var(--brand);border:3px solid var(--line);background:var(--bg);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:170px;justify-content:flex-start;transition:transform .15s,border-color .15s,box-shadow .15s}
.opt .dot{width:64px;height:64px;border-radius:50%;background:var(--surface);border:3px solid var(--oc);color:var(--oc);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;flex:none}
.opt .dot.pic{border-color:var(--line);font-size:2.4rem;font-family:inherit}
.opt.reading .dot.pic,.opt[aria-pressed="true"] .dot.pic{background:var(--surface);border-color:var(--oc)}
.opt.reading .dot,.opt[aria-pressed="true"] .dot{background:var(--oc);color:var(--brand-ink)}
.opt .t{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
.opt:hover{border-color:var(--oc)}
.opt.reading{border-color:var(--oc);box-shadow:0 0 0 6px color-mix(in srgb,var(--oc) 25%,transparent);transform:scale(1.03)}
.opt[aria-pressed="true"]{border-color:var(--oc);background:var(--surface);transform:scale(1.04)}
@media (max-width:620px){.opt{flex-direction:row;min-height:0;padding:14px 16px;gap:16px;text-align:left}.opt .dot{width:48px;height:48px;font-size:1.6rem}}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
textarea{font:inherit;font-size:1.1rem;width:100%;min-height:120px;border-radius:16px;border:2px solid var(--line);padding:12px;background:var(--bg);color:var(--ink);box-sizing:border-box}

/* end */
.end{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding-block:36px}
.stars{display:flex;gap:14px}
.stars span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--brand);color:var(--brand);font-family:var(--display);font-weight:800;font-size:1.5rem}
@media (prefers-reduced-motion:no-preference){.stars span{animation:pop .6s ease both}.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}

/* panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.comp{border-left:6px solid var(--c);padding:12px 14px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.comp h3{font-size:1.1rem;color:var(--c)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--c)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:600;font-size:.72rem;letter-spacing:.03em;color:var(--muted);vertical-align:bottom}
th.c{border-top:4px solid var(--c)}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
td.h0{background:var(--h0);color:var(--h-ink)} td.h1{background:var(--h1);color:var(--h-ink)} td.h2{background:var(--h2);color:var(--h-ink)} td.h3{background:var(--h3);color:var(--h-ink);font-weight:700}
td.ok{color:var(--ok);font-weight:700} td.no{color:var(--no);font-weight:700}
td.str{text-align:left;font-size:.8rem}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;margin:1px 2px;font-size:.75rem;font-weight:600;color:#fff;background:var(--c)}
.flag{display:inline-block;font-size:.7rem;font-weight:600;color:var(--flag);background:var(--flag-bg);border-radius:6px;padding:1px 6px;margin-left:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:150px}
.status{font-size:.85rem;padding:8px 12px;border-radius:10px;background:var(--lvl2);color:var(--lvl-ink)}
.mini{border:0;background:none;font-size:.8rem;text-decoration:underline;padding:2px 4px}
.mini.del{color:var(--no)} .mini.ev{color:var(--brand);font-weight:600}
.comments{display:flex;flex-direction:column;gap:8px}
.comments p{margin:0;padding:10px 12px;background:var(--surface);border-radius:12px}
.evalgrid{display:flex;flex-direction:column;gap:4px}
.evalrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
@media (max-width:620px){.evalrow{grid-template-columns:1fr}}
.evalrow .sk{display:flex;flex-direction:column;gap:2px;min-width:0}
.evalrow .sk b{color:var(--c)}
.lvlbtns{display:flex;gap:6px;flex-wrap:wrap}
.lvlbtns button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:.85rem}
.lvlbtns button[aria-pressed="true"].v1{background:var(--lvl1);border-color:var(--lvl1);color:var(--lvl-ink)}
.lvlbtns button[aria-pressed="true"].v2{background:var(--lvl2);border-color:var(--lvl2);color:var(--lvl-ink)}
.lvlbtns button[aria-pressed="true"].v3{background:var(--lvl3);border-color:var(--lvl3);color:var(--lvl-ink)}
/* ajustes de layout para Chromebook e tablet */
#app.kid > .card{margin-block:auto}
#app.kid > .nav{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.q{border-top:0;padding-top:24px;gap:16px}
.qrow .qtext{text-wrap:pretty;max-width:32ch}
.wheelimg{width:min(280px,78vw,30vh)}
.opt{position:relative;min-height:clamp(130px,16vh,190px);justify-content:center;padding:14px 12px;gap:10px}
.opt .dot{width:54px;height:54px;font-size:1.8rem}
.opt .dot.pic{font-size:2rem}
.opt[aria-pressed="true"]{padding:13px 11px}
.opts{margin-top:clamp(14px,3vh,32px);gap:18px;max-width:780px;margin-inline:auto}
.opt .t{font-size:clamp(1.05rem,1rem + .3vw,1.3rem)}
.opt[aria-pressed="true"]{background:color-mix(in srgb,var(--brand) 12%,var(--surface));border-color:var(--brand);border-width:4px;padding:17px 13px}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:1.05rem}
.btn:disabled{background:var(--line);color:var(--muted);opacity:1}
.nav .btn[data-act="next"]{min-width:170px}
@media (max-width:620px){.opt{min-height:0}.opt[aria-pressed="true"]::after{top:50%;transform:translateY(-50%)}}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:540px}
@media (max-width:420px){.opts.two{grid-template-columns:1fr}}
.fb{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,1rem + .3vw,1.3rem);text-align:left;max-width:780px;width:100%;box-sizing:border-box}
.fb span{font-size:1.8rem;line-height:1}
.fb.ok{background:var(--lvl3);color:var(--lvl-ink)}
.fb.no{background:var(--lvl2);color:var(--lvl-ink)}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .35s ease both}}
.opt.tried{opacity:.38;cursor:not-allowed}
.opt.tried:hover{border-color:var(--line)}
</style>

</head>
<body>
<div id="app"></div>

<script>
(() => {
/* =====================================================================
   COMO A AVALIAÇÃO FUNCIONA
   1) "Qual é mais parecido com você?" — 10 perguntas, cada uma com 3 frases
      POSITIVAS de 3 competências diferentes. Como todas são boas, não há
      resposta "bonita". As 10 combinações cobrem os 5 grupos do Big 5
      igualmente (cada um aparece 6 vezes). Resultado: perfil de forças.
   2) Situações — todas as opções são gentis e razoáveis; só uma mostra a
      habilidade com mais profundidade (conhecimento, não "bom comportamento").
   3) As respostas aparecem em cartões neutros (mesma forma, cor fixa por
      posição, sem desenho que indique a "melhor"). A ordem muda a cada aluno.
   ===================================================================== */
const COMPS = {
  cog:{pt:"Cognitivo",en:"Cognitive",c:"--cog"},
  glo:{pt:"Global",en:"Global",c:"--glo"},
  dig:{pt:"Digital",en:"Digital",c:"--dig"},
  aut:{pt:"Autoliderança",en:"Self-leadership",c:"--aut"},
  int:{pt:"Interpessoal",en:"Interpersonal",c:"--int"}
};
const CK = Object.keys(COMPS);
const SKILLS = {
  pc:{pt:"Pensamento crítico",en:"Critical thinking",comp:"cog"},
  cr:{pt:"Criatividade",en:"Creativity",comp:"cog"},
  cu:{pt:"Curiosidade",en:"Curiosity",comp:"cog"},
  ci:{pt:"Cidadania",en:"Citizenship",comp:"glo"},
  ac:{pt:"Ação",en:"Action",comp:"glo"},
  ic:{pt:"Compreensão intercultural",en:"Intercultural understanding",comp:"glo"},
  al:{pt:"Letramento digital",en:"Digital literacy",comp:"dig"},
  re:{pt:"Responsabilidade",en:"Responsibility",comp:"dig"},
  in:{pt:"Inovação",en:"Innovation",comp:"dig"},
  co:{pt:"Confiança",en:"Confidence",comp:"aut"},
  aa:{pt:"Aprender a aprender",en:"Learning to learn",comp:"aut"},
  be:{pt:"Bem-estar",en:"Wellbeing",comp:"aut"},
  cl:{pt:"Colaboração",en:"Collaboration",comp:"int"},
  cm:{pt:"Comunicação",en:"Communication",comp:"int"},
  se:{pt:"Socioemocional",en:"Social-emotional",comp:"int"}
};

/* Frases positivas por competência (6 cada = 3 habilidades × 2) */
const STM = {
 1:{
  cog:[{sk:"cu",pt:"Eu gosto de perguntar sobre as coisas novas que vejo.",en:"I like asking questions about new things."},
       {sk:"cr",pt:"Eu gosto de inventar brincadeiras novas.",en:"I like making up new games."},
       {sk:"pc",pt:"Eu gosto de adivinhar o que vai acontecer na história.",en:"I like guessing what will happen next in a story."},
       {sk:"cu",pt:"Eu gosto de descobrir como as coisas funcionam.",en:"I like finding out how things work."},
       {sk:"cr",pt:"Eu gosto de desenhar coisas que imaginei.",en:"I like drawing things I imagined."},
       {sk:"pc",pt:"Quando algo não dá certo, eu tento de outro jeito.",en:"When something doesn't work, I like trying another way."}],
  glo:[{sk:"ci",pt:"Eu gosto de ajudar a arrumar a sala.",en:"I like helping tidy the classroom."},
       {sk:"ic",pt:"Eu gosto de aprender palavras em outra língua.",en:"I like learning words in another language."},
       {sk:"ac",pt:"Eu gosto de pensar em ideias para o recreio ficar mais legal.",en:"I like having ideas to make playtime better."},
       {sk:"ci",pt:"Eu gosto de cuidar das plantas e dos bichinhos da escola.",en:"I like looking after the school's plants and animals."},
       {sk:"ic",pt:"Eu gosto de experimentar comidas de outros países.",en:"I like trying food from other countries."},
       {sk:"ac",pt:"Eu gosto de ajudar a separar o lixo para reciclar.",en:"I like helping sort rubbish for recycling."}],
  dig:[{sk:"al",pt:"Eu consigo mexer no tablet sozinho.",en:"I like using the tablet by myself."},
       {sk:"in",pt:"Eu gosto de fazer um robô ou um personagem se mexer.",en:"I like making a robot or character move."},
       {sk:"re",pt:"Eu uso o tablet só na hora combinada.",en:"I like using the tablet only at the agreed time."},
       {sk:"al",pt:"Eu sei achar o jogo certo no tablet.",en:"I like finding the right game on the tablet."},
       {sk:"in",pt:"Eu gosto de criar desenhos e músicas no tablet.",en:"I like creating drawings and music on the tablet."},
       {sk:"re",pt:"Quando aparece algo estranho na tela, eu chamo um adulto.",en:"I call a grown-up when something strange appears on the screen."}],
  aut:[{sk:"co",pt:"Eu gosto de tentar coisas difíceis.",en:"I like trying hard things."},
       {sk:"aa",pt:"Eu gosto de contar o que aprendi.",en:"I like telling people what I learned."},
       {sk:"be",pt:"Eu gosto de correr, pular e brincar.",en:"I like playing, running and jumping."},
       {sk:"co",pt:"Eu gosto de mostrar meus trabalhos para a turma.",en:"I like showing my work to the class."},
       {sk:"aa",pt:"Quando não entendo alguma coisa, eu peço ajuda.",en:"I ask for help when I don't understand."},

/* Monta as perguntas de cada estágio */
function buildItems(st){
  const used = {cog:0,glo:0,dig:0,aut:0,int:0};
  const scenes = st===1?SCENES1:SCENES2;
  const tri = TRIADS.map((cs,k)=>({id:`s${st}-f${k+1}`,t:"forca",i:scenes[k],
    o:cs.map(c=>({...STM[st][c][used[c]++],comp:c}))}));
  const sits = SITS[st].map(s=>({...s,t:"cena"}));
  // intercala situações entre as perguntas de forças
  const out = []; const gap = Math.ceil(tri.length/(sits.length+1));
  tri.forEach((it,k)=>{ out.push(it); if((k+1)%gap===0 && sits.length) out.push(sits.shift()); });
  return out.concat(sits);
}

/* ---------- voz com destaque do cartão lido ---------- */
let speakToken = 0;
/* Escolhe a voz mais natural disponível no aparelho (vozes "neurais"/"naturais" primeiro, depois Google, depois as do sistema) */
function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  const want = S.lang==="pt" ? "pt" : "en", region = S.lang==="pt" ? /pt[-_]BR/i : /en[-_](GB|US)/i;
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(want));
  if(!vs.length) return null;
  const score = v => (/natural|neural|online|enhanced|premium|aprimorad/i.test(v.name)?6:0) + (/google/i.test(v.name)?4:0)
    + (/luciana|francisca|thalita|antonio|camila|vitória|vitoria|libby|sonia|serena|samantha/i.test(v.name)?3:0)
    + (region.test(v.lang)?2:0) + (/pt[-_]PT/i.test(v.lang)?-5:0) + (v.localService?0:1);
  return vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
function setReading(i){
  S.reading = i;
  document.querySelectorAll(".opt").forEach((el,k)=>el.classList.toggle("reading",k===i));
}
function speakSeq(parts,onDone){
  const tok = ++speakToken;
  setReading(-1);
  if(!("speechSynthesis" in window)){ onDone&&onDone(); return; }
  try{
    speechSynthesis.cancel();
    const voice = pickVoice();
    parts.forEach((p,k)=>{
      const u = new SpeechSynthesisUtterance(p.text);
      u.lang = S.lang==="pt" ? "pt-BR" : "en-GB"; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1;
      u.onstart = ()=>{ if(tok===speakToken) setReading(p.hi); };
      if(k===parts.length-1){ const end = ()=>{ if(tok===speakToken){ setReading(-1); onDone&&onDone(); } }; u.onend = end; u.onerror = end; }
      speechSynthesis.speak(u);
    });
  }catch(e){ onDone&&onDone(); }
}
/* Depois que as 3 opções foram lidas, passar o mouse sobre uma delas repete a leitura daquela opção */
let readDone = false, hoverPos = -1;
function speakOption(pos){
  const it = currentItems()[S.idx]; if(!it) return;
  const k = S.perm[it.id][pos];
  speakSeq([{text:spokenPrefix(pos)+optText(it,k),hi:pos}]);
}
function speakCurrent(){
  if(S.screen==="intro"){ speakSeq([{text:t("introTitle").replace("{n}",firstName())+" "+t(introKey()),hi:-1}]); return; }
  const it = currentItems()[S.idx];
  if(!it){ speakSeq([{text:L(OPEN_Q),hi:-1}]); return; }
  const order = S.perm[it.id];
  readDone = false; hoverPos = -1;
  speakSeq([{text:qText(it),hi:-1}].concat(order.map((k,pos)=>({text:spokenPrefix(pos)+optText(it,k),hi:pos}))), ()=>{ readDone = true; });
}

async function saveResponse(){

    teste:S.test, nome:S.name.trim(), serie:S.grade, turma:S.section.trim(), estagio:stageOf(S.grade), idioma:S.lang,
    data:new Date().toISOString(), duracaoSeg:Math.round((Date.now()-S.startedAt)/1000), itens:{}, aberta:S.openText.trim()};
  for(const it of items){
    const a = (it.t==="ident" && S.first[it.id]!=null) ? S.first[it.id] : S.answers[it.id]; if(a==null) continue;
    const ms = Math.round(S.times[it.id]||0), pos = S.perm[it.id].indexOf(a);
    rec.itens[it.id] = it.t==="forca" ? {tipo:"forca",comp:it.o[a].comp,sk:it.o[a].sk,pos,ms}

          const nivel = key===it.ans ? 2 : (st===2 && SKILLS[key].comp===SKILLS[it.ans].comp ? 1 : 0);
          return {tipo:"ident",ans:it.ans,escolha:key,nivel,pos,ms}; })()
      : it.t==="roda" ? (it.k==="viu" ? {tipo:"roda",k:"viu",viu:it.o[a].v,pos,ms} : {tipo:"roda",k:"sabe",correto:!!it.o[a].ok,pos,ms})
      : {tipo:"cena",sk:it.sk,correto:!!it.o[a].ok,pos,ms};
  }
  S.saveMsg = t("saving"); render();
  for(let tries=0;tries<3;tries++){
    try{ await api("add",{doc:rec}); S.saveMsg = t("saved"); render(); return; }
    catch(e){ await new Promise(r=>setTimeout(r,800+Math.random()*900)); }
  }
  const q = localQueue(); q.push(rec); setLocalQueue(q);
  S.saveMsg = t("savedLocal"); render();
}

/* ---------- análise ---------- */
function wheelOf(r){ const o={viu:null,sabe:null}; Object.values(r.itens||{}).forEach(a=>{ if(a.tipo!=="roda") return; if(a.k==="viu") o.viu=a.viu; else o.sabe=!!a.correto; }); return o; }
function picks(r){ const c={cog:0,glo:0,dig:0,aut:0,int:0}; Object.values(r.itens||{}).forEach(a=>{ if(a.tipo==="forca") c[a.comp]++; }); return c; }
function topOf(obj){ const m=Math.max(...Object.values(obj)); return m>0?Object.keys(obj).filter(k=>obj[k]===m):[]; }
function top2(obj){ return Object.keys(obj).filter(k=>obj[k]>0).sort((a,b)=>obj[b]-obj[a]).slice(0,2); }
function teacherByComp(r){
  if(!r.professor) return null;
  const s={},n={}; Object.entries(r.professor).forEach(([sk,v])=>{ const c=SKILLS[sk]?.comp; if(!c) return; s[c]=(s[c]||0)+v; n[c]=(n[c]||0)+1; });
  const avg={}; Object.keys(s).forEach(c=>avg[c]=s[c]/n[c]); return Object.keys(avg).length?avg:null;
}
function flagsOf(r){
  const vals = Object.values(r.itens||{}), f = [];
  const timed = vals.filter(a=>a.ms>0);
  if(timed.length>=4 && timed.filter(a=>a.ms<FAST_MS).length/timed.length>0.5) f.push(t("flagFast"));
  if(vals.length>=6){ const cnt=[0,0,0]; vals.forEach(a=>{ if(a.pos>=0) cnt[a.pos]++; }); if(Math.max(...cnt)/vals.length>=0.75) f.push(t("flagSame")); }
  return f;
}

  // acertos por competência
  const by={}; CK.forEach(c=>by[c]={ok:0,part:0,n:0});
  rows.forEach(r=>identOf(r).forEach(a=>{ const c=ansComp(r.estagio,a.ans); by[c].n++; if(a.nivel===2) by[c].ok++; else if(a.nivel===1) by[c].part++; }));
  html += `<h2 style="font-size:1.4rem">${esc(t("identTitle"))}</h2><p class="note" style="margin:0">${esc(t("identNote"))}</p><div class="kpis">`
    + CK.map(c=>{ const b=by[c]; const pc=b.n?Math.round(b.ok/b.n*100):0;
      return `<div class="comp" style="--c:var(${COMPS[c].c})"><h3>${esc(L(COMPS[c]))}</h3><div class="meter"><span style="width:${pc}%"></span></div><span class="note">${pc}% ✓${b.part?` · ${Math.round(b.part/b.n*100)}% ◐`:""}</span></div>`; }).join("") + `</div>`;
  // sinais
  const flagged = rows.map(r=>({r,f:flagsOf(r)})).filter(x=>x.f.length);
  if(flagged.length) html += `<h2 style="font-size:1.4rem">${esc(t("flagsTitle"))}</h2><p class="note" style="margin:0">${esc(t("flagsNote"))}</p>
    <div class="comments">${flagged.map(({r,f})=>`<p><strong>${esc(r.nome)}</strong> (${esc(r.serie)}${r.turma?" "+esc(r.turma):""})${f.map(x=>`<span class="flag">${esc(x)}</span>`).join("")}</p>`).join("")}</div>`;
  // por aluno
  const stages = [...new Set(rows.map(r=>r.estagio))].sort();
  for(const st of stages){
    const rs = rows.filter(r=>r.estagio===st), its = ITEMS.saber[st].filter(it=>it.t==="ident" && rs.some(r=>r.itens?.[it.id]));
    html += `<h2 style="font-size:1.4rem">${esc(t("byStudent"))} · ${st===1?"K4–Y2":"Y3–Y5"}</h2>
    <div class="legend"><span>${esc(t("identNote"))}</span></div>
    <div class="tablewrap"><table><thead><tr><th class="name">${esc(t("name"))}</th><th>${esc(t("grade"))}</th><th>${esc(t("seenCol"))}</th><th>${esc(t("knowsCol"))}</th><th>${esc(t("score"))}</th>
      ${its.map(it=>`<th class="c" style="--c:var(${COMPS[ansComp(st,it.ans)].c})" title="${esc(L(it)+" — Quadro iSP: "+(it.ref||""))}">${esc(ansLabel(st,it.ans))}</th>`).join("")}<th></th></tr></thead><tbody>`
    + rs.map(r=>{ const w=wheelOf(r), fl=flagsOf(r), ids=identOf(r), ok=ids.filter(a=>a.nivel===2).length;
        return `<tr><td class="name">${esc(r.nome)}${fl.length?`<span class="flag" title="${esc(fl.join(", "))}">⚑</span>`:""}</td><td>${esc(r.serie)}${r.turma?" "+esc(r.turma):""}</td>
        <td>${w.viu?esc(t("seen")[w.viu-1]):"–"}</td>${w.sabe==null?`<td>–</td>`:`<td class="${w.sabe?"ok":"no"}">${w.sabe?"✓":"✗"}</td>`}
        <td><b>${ok}/${ids.length}</b></td>
        ${its.map(it=>{ const a=r.itens?.[it.id]; if(!a) return `<td>–</td>`; return a.nivel===2?`<td class="ok">✓</td>`:a.nivel===1?`<td class="part" title="${esc(t("partial"))}">◐</td>`:`<td class="no" title="${esc(a.escolha)}">✗</td>`; }).join("")}
        <td>${delCell(r)}</td></tr>`; }).join("") + `</tbody></table></div>`;
  }
  return html;
}

function render(){
  const focusId = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  app.className = ["intro","quiz","end"].includes(S.screen) ? "kid" : "";
  app.innerHTML = S.screen==="intro"?renderIntro():S.screen==="quiz"?renderQuiz():S.screen==="end"?renderEnd():S.screen==="gate"?renderGate():S.screen==="panel"?renderPanel():renderStart();
  document.documentElement.lang = S.lang==="pt"?"pt-BR":"en";
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
}
function showQuestion(){ S.shownAt = performance.now(); S.reading=-1; render(); window.scrollTo(0,0); speakCurrent(); }

/* ---------- eventos ---------- */
app.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a==="lang"){ S.lang=v; savePrefs(); render(); if(S.screen==="quiz"||S.screen==="intro") speakCurrent(); }
  else if(a==="grade"){ S.grade=v; savePrefs(); render(); }
  else if(a==="test"){ S.test=v; savePrefs(); render(); }
  else if(a==="ptab"){ S.panelTest=v; S.evalId=null; S.confirmDel=null; render(); }
  else if(a==="start"){
    S.idx=0; S.answers={}; S.times={}; S.openText=""; S.perm={}; S.first={}; S.tried={}; S.solved={}; S.fb=null;
    // K4/K5: nas situações, só 2 opções (a certa e a primeira alternativa)
    currentItems().forEach(it=>{ S.perm[it.id]= it.fixed ? it.o.map((_,k)=>k) : (it.t==="ident" && isKid()) ? shuffle(2) : shuffle(it.o.length); });
    S.screen="intro"; render(); window.scrollTo(0,0); speakCurrent();
  }
  else if(a==="go"){ S.startedAt=Date.now(); S.screen="quiz"; showQuestion(); }
  else if(a==="speak"){ speakCurrent(); }
  else if(a==="answer"){
    const it = currentItems()[S.idx];
    if(S.times[it.id]==null) S.times[it.id] = performance.now()-S.shownAt;
    // tocar/clicar seleciona e lê a opção de novo; avançar só pelo botão "Próxima"
    // numa situação já acertada, tocar só repete a leitura
    if(!(it.t==="ident" && S.solved[it.id])){ S.answers[it.id]=+v; if(S.fb && S.fb.id===it.id) S.fb=null; }
    render();
    const pos = +b.dataset.pos; hoverPos = pos; readDone = true; speakOption(pos);
  }
  else if(a==="next"){
    const it = currentItems()[S.idx];
    if(it && S.answers[it.id]==null) return;
    // atividade 2: primeiro confere a resposta; só a primeira tentativa vai para o registro
    if(it && it.t==="ident" && !S.solved[it.id]){
      const k = S.answers[it.id];
      if(S.first[it.id]==null) S.first[it.id] = k;
      if(it.o[k].key===it.ans){ S.solved[it.id]=true; S.fb={id:it.id,ok:true}; render(); speakSeq([{text:fbOkText(it),hi:-1}]); }
      else { (S.tried[it.id]=S.tried[it.id]||[]).push(k); delete S.answers[it.id]; S.fb={id:it.id,ok:false,k}; render(); speakSeq([{text:fbNoText(it,k),hi:-1}]); }
      return;
    }
    S.fb = null;
    if(S.idx < totalSteps()-1){ S.idx++; showQuestion(); } else { finish(); }
  }
  else if(a==="back"){ if(S.idx>0){ S.idx--; S.fb=null; showQuestion(); } }
  else if(a==="finish"){ finish(); }
  else if(a==="nextStudent"){ S.name=""; S.screen="start"; S.saveMsg=""; render(); document.getElementById("f-name")?.focus(); }
  else if(a==="gate"){ S.gateErr=false; if(painelCode){ S.screen="panel"; loadRows(); } else { S.screen="gate"; render(); document.getElementById("f-code")?.focus(); } }
  else if(a==="enterPanel"){ const c=(document.getElementById("f-code")?.value||"").trim().toUpperCase(); if(!c) return;
    try{ await api("check",{},c); painelCode=c; try{sessionStorage.setItem("lc-painel",c);}catch(_){} S.screen="panel"; S.evalMsg=""; loadRows(); }
    catch(e){ S.gateErr=true; S.gateMsg = e.status===401 ? t("wrong") : t("netErr"); render(); } }
  else if(a==="refresh"){ loadRows(); }
  else if(a==="home"){ S.screen="start"; S.confirmDel=null; S.evalId=null; render(); }
  else if(a==="askDel"){ S.confirmDel=v; render(); }
  else if(a==="cancelDel"){ S.confirmDel=null; render(); }
  else if(a==="doDel"){ S.confirmDel=null; try{ await api("delete",{id:v},painelCode); S.rows=S.rows.filter(r=>r.id!==v); }catch(e){ S.evalMsg=t("netErr"); } render(); }
  else if(a==="openEval"){ const r=allRows().find(r=>r.id===v); S.evalId=v; S.evalDraft={...(r?.professor||{})}; S.evalMsg=""; render(); document.getElementById("evalcard")?.scrollIntoView({block:"start"}); }
  else if(a==="evalLvl"){ S.evalDraft[b.dataset.sk]=+v; render(); }
  else if(a==="saveEval"){ saveEval(v); }
  else if(a==="cancelEval"){ S.evalId=null; S.evalDraft={}; render(); }
  else if(a==="csv"){ exportCsv(); }
});
app.addEventListener("pointerover", e=>{
  if(e.pointerType!=="mouse" || S.screen!=="quiz" || !readDone) return;
  const o = e.target.closest(".opt[data-pos]"); if(!o) return;
  const pos = +o.dataset.pos; if(pos===hoverPos) return;
  hoverPos = pos; speakOption(pos);
});
app.addEventListener("pointerout", e=>{
  const o = e.target.closest(".opt[data-pos]"); if(!o || o.contains(e.relatedTarget)) return;
  hoverPos = -1;
});
app.addEventListener("input", e=>{
  if(e.target.id==="f-name"){ S.name=e.target.value; const b=document.getElementById("b-start"); if(b) b.disabled=!(S.grade&&S.name.trim()); }
  if(e.target.id==="f-sec"){ S.section=e.target.value; savePrefs(); }
  if(e.target.id==="f-open"){ S.openText=e.target.value; }
});
app.addEventListener("change", e=>{
  if(e.target.id==="f-pg"){ S.panelGrade=e.target.value; S.panelSection=""; render(); }
  if(e.target.id==="f-ps"){ S.panelSection=e.target.value; render(); }
});
app.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="f-code"){ e.preventDefault(); app.querySelector('[data-act="enterPanel"]')?.click(); }
  if(e.key==="Enter" && e.target.id==="f-name"){ e.preventDefault(); document.getElementById("b-start")?.click(); }
});
function finish(){ speakToken++; try{speechSynthesis.cancel();}catch(e){} S.screen="end"; render(); saveResponse(); }

function baixar(nome, texto){
  const url = URL.createObjectURL(new Blob(["\ufeff"+texto],{type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function exportCsv(){
  if(S.panelTest==="saber") return exportCsvSaber();
  const rows = filtered();
  const lv = ["","Iniciando","Desenvolvendo","Dominando"];
  const sits = [...SITS[1],...SITS[2]];
  const head = ["nome","serie","turma","estagio","data","duracao_seg","sinais",
    ...CK.map(c=>"escolhas "+COMPS[c].pt+" (0-6)"),"forcas_aluno","forcas_professor",
    ...sits.map(s=>s.id+" ("+SKILLS[s.sk].pt+")"),
    ...Object.keys(SKILLS).map(k=>"professor: "+SKILLS[k].pt),"resposta_aberta"];
  const q = s => '"'+String(s??"").replace(/"/g,'""')+'"';
  const lines = [head.map(q).join(";")].concat(rows.map(r=>{ const p=picks(r), tc=teacherByComp(r); return [r.nome,r.serie,r.turma,r.estagio,new Date(r.data).toLocaleDateString("pt-BR"),r.duracaoSeg??"",flagsOf(r).join(", "),
    ...CK.map(c=>p[c]), top2(p).map(c=>COMPS[c].pt).join(", "), tc?top2(tc).map(c=>COMPS[c].pt).join(", "):"",
    ...sits.map(s=>{const a=r.itens?.[s.id]; return a?(a.correto?"escolheu a opção mais completa":"outra opção"):"";}),
    ...Object.keys(SKILLS).map(k=>lv[r.professor?.[k]||0]), r.aberta].map(q).join(";"); }));
  baixar("life-competencies-autoavaliacao.csv", lines.join("\n"));
}

async function exportCsvSaber(){
  const rows = filtered();
  const its = [...ITEMS.saber[1],...ITEMS.saber[2]].filter(it=>it.t==="ident");
  const head = ["nome","serie","turma","estagio","data","duracao_seg","sinais","ja_viu_a_roda","sabe_o_que_a_roda_significa","acertos",
    ...its.map(it=>it.id+" (resposta: "+(it.id.startsWith("s1")?COMPS[it.ans].pt:SKILLS[it.ans].pt)+")")];
  const q = s => '"'+String(s??"").replace(/"/g,'""')+'"';
  const nm = k => COMPS[k]?COMPS[k].pt:(SKILLS[k]?SKILLS[k].pt:k);
  const lines = [head.map(q).join(";")].concat(rows.map(r=>{ const w=wheelOf(r), ids=identOf(r); return [r.nome,r.serie,r.turma,r.estagio,new Date(r.data).toLocaleDateString("pt-BR"),r.duracaoSeg??"",flagsOf(r).join(", "),
    w.viu?["Nunca viu","Talvez","Já viu"][w.viu-1]:"", w.sabe==null?"":(w.sabe?"sim":"não"), ids.filter(a=>a.nivel===2).length+"/"+ids.length,
    ...its.map(it=>{const a=r.itens?.[it.id]; if(!a) return ""; return a.nivel===2?"acertou":a.nivel===1?"só a competência ("+nm(a.escolha)+")":"errou ("+nm(a.escolha)+")";})].map(q).join(";"); }));
  baixar("life-competencies-o-que-eu-sei.csv", lines.join("\n"));
}

if("speechSynthesis" in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
render();
})();
</script>
